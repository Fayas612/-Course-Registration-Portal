<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Signup validation</title></head><body>
<h1>Signup validation demonstration</h1>
<form id="signup" onsubmit="return validateForm()" action="success.html">
<label for="name">Name</label><input type="text" id="name" placeholder="Name">
<label for="email">Email</label><input type="text" id="email" placeholder="Email">
<label for="password">Password</label><input type="password" id="password" placeholder="Password">
<p id="error" role="alert"></p><button type="submit">Register</button></form>
<script src="validation.js"></script></body></html>
